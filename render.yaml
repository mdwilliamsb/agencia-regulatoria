# Despliegue en Render con un clic: Dashboard → New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: agencia-regulatoria
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/estado
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agencia-db
          property: connectionString
      - key: SETUP_CODE
        generateValue: true
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: archivos
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: agencia-db
    plan: basic-256mb
    region: oregon
    databaseName: agencia
    user: agencia
